<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jumlah Hari Belajar</title>
<style>
:root{font-family:Arial,sans-serif}
body{margin:0;padding:20px;background:#f5f7fb;color:#172033}
.app{max-width:620px;margin:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{text-align:center;font-size:21px;margin:0 0 4px}
.note{text-align:center;color:#667085;font-size:13px;margin-bottom:18px}
.year{text-align:center;margin-bottom:18px;font-weight:700}
input{font:inherit;border:1px solid #d9dee8;border-radius:9px;padding:9px;box-sizing:border-box}
.year input{width:90px;text-align:center;font-weight:700}
.row{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid #e7eaf0}
.head{font-weight:700;background:#f8fafc}
.days{text-align:right;width:100%}
.total{font-weight:800;background:#eeeaff;font-size:17px}
.total input{font-weight:800;background:transparent}
button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
#editBtn{background:#172033;color:white}
#saveBtn{background:#172033;color:white;display:none}
#cancelBtn{display:none}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.status{text-align:center;font-size:13px;color:#667085;margin-top:10px}
@media(max-width:480px){body{padding:10px}.app{padding:15px}.row{grid-template-columns:1fr 105px}}
</style>
</head>
<body>
<div class="app">
<h1>📚 JUMLAH HARI BELAJAR TAHUN <span id="titleYear">2026</span></h1>
<div class="note">Paparan rasmi jumlah hari belajar</div>
<div class="year">Tahun: <input id="year" type="number" value="2026" disabled></div>
<div id="table"></div>
<div class="actions">
<button id="editBtn" type="button">✏️ EDIT</button>
<button id="cancelBtn" type="button">Batal</button>
<button id="saveBtn" type="button">💾 SIMPAN</button>
</div>
<div id="status" class="status"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const ADMIN_ID="48806236";
/* Selepas Apps Script siap, tampal URL web app di bawah. */
const API_URL="https://script.google.com/macros/s/AKfycbyrRxp4zbfa12kyS98RhYFZXCz0WtzKzqxs3NVJHER8cSo-dIVAWfAi31r7Rkuo-aapOQ/exec";

const months=["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
let data={year:2026,days:[14,14,13,22,15,19,23,18,0,0,0,0]};
let editing=false, admin=false;

function render(){
  document.getElementById("titleYear").textContent=data.year;
  document.getElementById("year").value=data.year;
  const table=document.getElementById("table");
  table.innerHTML='<div class="row head"><div>Bulan</div><div style="text-align:right">Hari Belajar</div></div>';
  months.forEach((m,i)=>{
    table.insertAdjacentHTML("beforeend",
      `<div class="row"><div>${m}</div><input class="days monthInput" type="number" min="0" max="366" value="${data.days[i]}" ${editing?"":"disabled"}></div>`);
  });
  const total=data.days.reduce((a,b)=>a+(Number(b)||0),0);
  table.insertAdjacentHTML("beforeend",
    `<div class="row total"><div>JUMLAH TERKUMPUL</div><input class="days" id="total" type="number" value="${total}" disabled></div>`);
  if(editing){
    document.querySelectorAll(".monthInput").forEach(x=>x.addEventListener("input",updateTotal));
    document.getElementById("year").disabled=false;
    document.getElementById("year").addEventListener("input",()=> {
      data.year=Math.max(1900,Math.min(9999,Number(document.getElementById("year").value)||2026));
      document.getElementById("titleYear").textContent=data.year;
    });
  }
}
function updateTotal(){
  const vals=[...document.querySelectorAll(".monthInput")].map(x=>Math.max(0,Math.min(366,Number(x.value)||0)));
  data.days=vals;
  document.getElementById("total").value=vals.reduce((a,b)=>a+b,0);
}
function setStatus(t){document.getElementById("status").textContent=t}
function enterEdit(){
  if(!admin){setStatus("Mod edit hanya untuk admin.");return}
  editing=true; render();
  document.getElementById("editBtn").style.display="none";
  document.getElementById("cancelBtn").style.display="inline-block";
  document.getElementById("saveBtn").style.display="inline-block";
  setStatus("Mod edit aktif.");
}
function cancelEdit(){editing=false;load()}
async function save(){
  updateTotal();
  if(API_URL.includes("PASTE_")){setStatus("URL Apps Script belum dipasang.");return}
  setStatus("Menyimpan...");
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"save",adminId:ADMIN_ID,year:data.year,days:data.days})});
    const out=await res.json();
    if(!out.ok) throw new Error(out.error||"Gagal simpan");
    editing=false;render();setButtons();setStatus("✓ Berjaya disimpan.");
  }catch(e){setStatus("Gagal simpan. Semak URL Apps Script.");}
}
async function load(){
  if(API_URL.includes("PASTE_")){render();setButtons();return}
  try{
    const res=await fetch(API_URL);
    const out=await res.json();
    if(out.ok&&out.data)data=out.data;
  }catch(e){}
  render();setButtons();
}
function setButtons(){
  document.getElementById("editBtn").style.display=editing?"none":"inline-block";
  document.getElementById("cancelBtn").style.display=editing?"inline-block":"none";
  document.getElementById("saveBtn").style.display=editing?"inline-block":"none";
}
document.getElementById("editBtn").addEventListener("click",enterEdit);
document.getElementById("cancelBtn").addEventListener("click",cancelEdit);
document.getElementById("saveBtn").addEventListener("click",save);

/* Untuk keselamatan, akses edit ditentukan oleh ID Telegram.
   Jika dibuka di Telegram Mini App, Telegram.WebApp.initDataUnsafe.user.id digunakan.
   Untuk ujian luar Telegram, admin kekal berdasarkan ID yang ditetapkan. */
(function(){
  try{
    const id=window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    admin=String(id||"")===ADMIN_ID;
  }catch(e){admin=false}
  load();
})();
</script>
</body>
</html>
